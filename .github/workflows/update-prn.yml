name: Update PRN map

on:
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate js/prnmap.js from IGS satellite metadata
        run: python .github/scripts/update_prn.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/prnmap.js
          git diff --cached --quiet || git commit -m "Update PRN map from IGS satellite metadata"
          git push
